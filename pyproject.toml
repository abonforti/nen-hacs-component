[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nen-hacs-component"
version = "1.0.0"
description = "NeN Energy custom integration for Home Assistant"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pycognito>=2024.5.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-v --strict-markers"

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["custom_components/nen", "tests"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # Pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "UP",    # pyupgrade
    "ASYNC", # flake8-async
]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components.nen"]

[tool.mypy]
python_version = "3.13"
show_error_codes = true
ignore_missing_imports = true
warn_unused_configs = true
files = ["custom_components/nen"]

[tool.coverage.run]
source = ["custom_components/nen"]
branch = true

[tool.coverage.report]
show_missing = true
